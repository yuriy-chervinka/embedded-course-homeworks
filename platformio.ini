; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[base_config]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

[env:hw1_program1]
extends = base_config
build_flags = -D RUN_HW1_PROG1

[env:hw1_program2]
extends = base_config
build_flags = -D RUN_HW1_PROG2

[env:hw1_program3]
extends = base_config
build_flags = -D RUN_HW1_PROG3

[env:hw1_program4]
extends = base_config
build_flags = -D RUN_HW1_PROG4

[env:hw1_program5]
extends = base_config
build_flags = -D RUN_HW1_PROG5

[env:hw2_program1]
extends = base_config
build_flags = -D RUN_HW2_PROG1

[env:hw3_program1]
extends = base_config
build_flags = -D RUN_HW3_PROG1

[env:hw4_program1]
extends = base_config
build_flags = -D RUN_HW4_PROG1
